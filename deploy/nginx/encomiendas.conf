##############################################################
# Nginx – Configuración de producción para SistemaEncomienda
# Laravel 12 + PHP-FPM
##############################################################

server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    # Redirigir todo HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    # ── SSL ──────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Root del proyecto ────────────────────────────────────
    root /var/www/sistemaencomienda/src/public;
    index index.php;

    # ── Logs ────────────────────────────────────────────────
    access_log /var/log/nginx/encomiendas_access.log;
    error_log  /var/log/nginx/encomiendas_error.log;

    # ── Límite de tamaño de subida ───────────────────────────
    client_max_body_size 20M;

    # ── Headers de seguridad ─────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"            always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-XSS-Protection "1; mode=block"        always;
    add_header Referrer-Policy "strict-origin"         always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Routing principal ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ─────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.3-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # ── Assets estáticos con caché ───────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Denegar acceso a archivos ocultos (.env, .git, etc.) ─
    location ~ /\. {
        deny all;
    }
}
